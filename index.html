<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sih-project</title>
    <style>
      /* Aggressively hide Google Translate UI */
      body, html { top: 0px !important; position: static !important; margin-top: 0px !important; }
      .goog-te-banner-frame { display: none !important; visibility: hidden !important; }
      .skiptranslate iframe { display: none !important; visibility: hidden !important; }
      #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
      .VIpgJd-Zvi9od-aZ2wEe-wOHMyf { display: none !important; }
      .VIpgJd-Zvi9od-ORHb-OEVmcd { display: none !important; }
      div[style*="top: 0px;"] { display: none !important; } /* Targets the top wrapper */
      body { top: 0 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en', 
            includedLanguages: 'en,hi',
            autoDisplay: false
          }, 
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="text/javascript">
      // Mutation observer to actively destroy the Google Translate top bar if it ever appears
      const observer = new MutationObserver((mutations) => {
        const banner = document.querySelector('.goog-te-banner-frame');
        const skiptranslate = document.querySelector('.VIpgJd-Zvi9od-aZ2wEe-wOHMyf');
        if (banner) banner.remove();
        if (skiptranslate) skiptranslate.remove();
        document.body.style.top = '0px';
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
